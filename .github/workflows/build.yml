name: Build Mod
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21/25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21' # Set to 25 if your 26.2 setup explicitly forces Java 25

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Executable
        run: chmod +x gradlew

      # This runs the required mapping download directly inside the cloud container
      - name: Download Minecraft Sources
        run: ./gradlew genSources --no-daemon

      - name: Build Mod Jar
        run: ./gradlew build --no-daemon
